name: Prerelease
on:
  push:
    branches: [main]
    paths: ['package.json', 'docs/releases/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prerelease
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run zk:build
      - run: npm run test:zk
      - name: Publish the documented prerelease
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+-alpha\.\d+$/.test(version)) {
              throw new Error('This workflow publishes documented alpha prereleases only.');
            }
            const tag = `v${version}`;
            const body = fs.readFileSync(`docs/releases/${tag}.md`, 'utf8');
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              core.info(`Release ${tag} already exists; leaving it unchanged.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `${tag} — Synthetic proof MVP`,
                body,
                draft: false,
                prerelease: true,
                make_latest: 'false'
              });
            }
